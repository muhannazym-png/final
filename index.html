<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Memories</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         ПЕРВАЯ СТРАНИЦА
    ========================== -->

    <section id="welcomeScreen" class="welcome-screen">

        <button class="welcome-button" onclick="openMenu()">
            WELCOME
            <span>→</span>
        </button>

    </section>


    <!-- =========================
         ГЛАВНОЕ МЕНЮ
    ========================== -->

    <section id="menuScreen" class="menu-screen">

        <div class="menu-container">

            <!-- CALENDAR -->

            <button class="menu-card calendar-card" onclick="openPage('calendar')">

                <div class="icon blue">
                    📅
                </div>

                <div class="card-text">
                    <span>Calendar</span>
                </div>

            </button>


            <!-- WORDS -->

            <button class="menu-card words-card" onclick="openPage('words')">

                <div class="icon purple">
                    <span>WORDS</span>
                    <span>ONLY</span>
                </div>

                <div class="card-text">
                    <span>words only</span>
                    <span>we understand</span>
                </div>

            </button>


            <!-- PLAYLIST -->

            <button class="menu-card playlist-card" onclick="openPlaylist()">

                <div class="icon green">
                    🎵
                </div>

                <div class="card-text">
                    <span>playlist with</span>
                    <span>my favorite songs</span>
                    <span>our audio</span>
                </div>

            </button>


            <!-- LETTER -->

            <button class="menu-card letter-card" onclick="openPage('letter')">

                <div class="icon pink">
                    💌
                </div>

                <div class="card-text">
                    <span>read this when</span>
                    <span>you miss me</span>
                </div>

            </button>


            <!-- LETTER -->

           <button class="menu-card letter-main-card" onclick="openBottledLetter()">

                <div class="icon blue">
                    ✈
                </div>

                <div class="card-text">
                    <span>letter</span>
                </div>

            </button>


            <!-- PHOTO BOOK -->

            <button class="menu-card photo-card" onclick="openPage('photos')">

                <div class="icon yellow">
                    🖼
                </div>

                <div class="card-text">
                    <span>photo book</span>
                </div>

            </button>


            <!-- THINGS -->

            <button class="menu-card things-card" onclick="openPage('things')">

                <div class="icon purple">
                    ♡
                </div>

                <div class="card-text">
                    <span>things that reminds</span>
                    <span>me of you</span>
                </div>

            </button>

        </div>

    </section>

<!-- =========================
     INTERACTIVE MEMORY BOOK
========================= -->

<section id="photoBookScreen" class="photo-book-screen">

    <button class="book-close" onclick="closePhotoBook()">×</button>

    <div class="book-wrapper">

        <div class="memory-book" id="memoryBook">

            <div class="book-page" id="bookPage">

                <div class="photo-area">

                    <img id="memoryPhoto" src="photo (1).jpeg" alt="Memory">

                    <div class="photo-number" id="photoNumber">
                        1 / 90
                    </div>

                </div>

                <div class="memory-comment" id="memoryComment">

                    <div class="comment-inner">
                        <p id="commentText"></p>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <div class="book-hint">
        <span>← swipe →</span>
        <small>swipe up to read</small>
    </div>

</section>

<!-- =========================
     PLAYLIST
========================== -->

<section id="playlistPage" class="playlist-page">

    <div class="playlist-player">

        <button class="back-button" onclick="closePlaylist()">
            ← Back
        </button>

        <div class="song-cover">
            <img id="songCover" src="images/song1.jpg" alt="Song cover">
        </div>

        <div class="song-info">
            <h1 id="songTitle">Hum Tum Ek Kamre Mein Band Ho</h1>
            <p id="songArtist">Our memories</p>
        </div>

        <div class="progress-container">
            <span id="currentTime">0:00</span>

            <input
                type="range"
                id="progressBar"
                value="0"
                min="0"
                max="100"
            >

            <span id="duration">0:00</span>
        </div>

        <div class="player-buttons">

            <button onclick="previousSong()" class="control-button">
                ⏮
            </button>

            <button onclick="togglePlay()" class="play-button" id="playButton">
                ▶
            </button>

            <button onclick="nextSong()" class="control-button">
                ⏭
            </button>

            <button onclick="toggleRepeat()" class="repeat-button" id="repeatButton">
                🔁
            </button>

        </div>

        <div class="song-list" id="songList"></div>

    </div>

</section>

<audio id="audioPlayer"></audio>
    <script src="script.js"></script>
<!-- =========================
     BOTTLED LETTER
========================== -->

<section id="bottledScreen" class="bottled-screen">

    <div class="bottled-photo-wrapper">

        <!-- ТВОЁ ФОТО -->
        <img
            src="bottled_reference.jpeg"
            class="bottled-reference-image"
            alt="Bottled"
        >

        <!-- ОБЛАСТЬ, ПО КОТОРОЙ МОЖНО НАЖАТЬ -->
        <button
            class="bottle-hotspot"
            onclick="openBottledMessage()"
            aria-label="Open bottle"
        ></button>

    </div>

</section>


<!-- =========================
     BOTTLED MESSAGE
========================== -->

<section id="bottledMessageScreen" class="bottled-message-screen">

    <div class="bottled-message-wrapper">

        <!-- ТВОЁ ФОТО ПИСЬМА -->
        <img
            src="bottled_message.jpeg"
            class="bottled-message-image"
            alt="Message"
        >

        <div class="message-buttons">

            <button
                class="dismiss-button"
                onclick="dismissBottledMessage()"
            >
                ✕ &nbsp; Dismiss
            </button>

            <button
                class="keep-button"
                onclick="keepBottledMessage()"
            >
                ✓ &nbsp; Keep
            </button>

        </div>

    </div>

</section>


<!-- =========================
     AFTER KEEP
========================== -->

<section id="keptMessageScreen" class="kept-message-screen">

    <div class="kept-content">

        <div class="time-title">
            Together since
        </div>

        <div class="date-start">
            July 11, 2025 · 20:31
        </div>

        <div id="relationshipCounter" class="relationship-counter">
            Loading...
        </div>


        <!-- MESSAGE -->

        <div class="chat-message">

            <div class="chat-avatar">
                L
            </div>

            <div class="chat-message-content">

                <div class="chat-name">
                    Louise William
                </div>

                <div class="chat-bubble">
                    hiii
                </div>

            </div>

        </div>

    </div>

</section>
</body>
</html>
